<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Medical Record</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:linear-gradient(135deg,#ffe8f2,#fff7fb);
padding:25px;
color:#444;
}

.container{
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,.85);
backdrop-filter:blur(15px);
border-radius:24px;
padding:25px;
box-shadow:0 10px 25px rgba(255,170,200,.3);
}

h1{
text-align:center;
color:#ff5d98;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#888;
margin-bottom:20px;
}

.topbar{
display:flex;
justify-content:flex-end;
margin-bottom:20px;
}

select{
padding:10px;
border:none;
border-radius:12px;
background:white;
}

.section{
margin-top:20px;
}

.section h2{
color:#ff5d98;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
}

input,textarea{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#fff;
font-size:15px;
outline:none;
}

textarea{
height:90px;
resize:vertical;
}

button{
margin-top:20px;
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#ff72ab;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff4c92;
}

#bmi{
margin-top:10px;
font-weight:bold;
color:#ff4c92;
}
</style>

</head>
<body>

<div class="container">

<div class="card">

<div class="topbar">
<select id="language" onchange="changeLanguage()">
<option value="zh">繁體中文</option>
<option value="en">English</option>
<option value="jp">日本語</option>
<option value="kr">한국어</option>
</select>
</div>

<h1 id="title">🎀 My Medical Record</h1>
<p class="subtitle" id="subtitle">隨身病歷</p>

<div class="section">

<h2 id="basicTitle">👤 個人資料</h2>

<div class="grid">

<input id="name" placeholder="姓名">

<input id="birthday" type="date">

<input id="gender" placeholder="性別">

<input id="blood" placeholder="血型">

<input id="height" placeholder="身高(cm)" type="number">

<input id="weight" placeholder="體重(kg)" type="number">

</div>

<p id="bmi">BMI：--</p>

</div>

<div class="section">

<h2 id="allergyTitle">💊 過敏史</h2>

<textarea id="allergy"></textarea>

</div>

<div class="section">

<h2 id="historyTitle">🏥 病史</h2>

<textarea id="history"></textarea>

</div>

<div class="section">

<h2 id="medicineTitle">💉 長期用藥</h2>

<textarea id="medicine"></textarea>

</div>

<div class="section">

<h2 id="contactTitle">🚑 緊急聯絡人</h2>

<div class="grid">

<input id="contact" placeholder="姓名">

<input id="phone" placeholder="電話">

</div>

</div>

<div class="section">

<h2 id="noteTitle">📝 備註</h2>

<textarea id="note"></textarea>

</div>

<button onclick="save()" id="saveBtn">💾 儲存資料</button>

<script>

const lang={

zh:{
title:"🎀 My Medical Record",
subtitle:"隨身病歷",
basic:"👤 個人資料",
allergy:"💊 過敏史",
history:"🏥 病史",
medicine:"💉 長期用藥",
contact:"🚑 緊急聯絡人",
note:"📝 備註",
save:"💾 儲存資料"
},

en:{
title:"🎀 My Medical Record",
subtitle:"Personal Medical Record",
basic:"👤 Personal Information",
allergy:"💊 Allergies",
history:"🏥 Medical History",
medicine:"💉 Medications",
contact:"🚑 Emergency Contact",
note:"📝 Notes",
save:"💾 Save"
},

jp:{
title:"🎀 マイ医療記録",
subtitle:"医療記録",
basic:"👤 個人情報",
allergy:"💊 アレルギー",
history:"🏥 病歴",
medicine:"💉 常用薬",
contact:"🚑 緊急連絡先",
note:"📝 メモ",
save:"💾 保存"
},

kr:{
title:"🎀 나의 의료 기록",
subtitle:"의료 기록",
basic:"👤 개인정보",
allergy:"💊 알레르기",
history:"🏥 병력",
medicine:"💉 복용 약",
contact:"🚑 비상 연락처",
note:"📝 메모",
save:"💾 저장"
}
};
// ===== 語言切換 =====

function changeLanguage(){

let current=document.getElementById("language").value;

let t=lang[current];

document.getElementById("title").innerHTML=t.title;
document.getElementById("subtitle").innerHTML=t.subtitle;

document.getElementById("basicTitle").innerHTML=t.basic;
document.getElementById("allergyTitle").innerHTML=t.allergy;
document.getElementById("historyTitle").innerHTML=t.history;
document.getElementById("medicineTitle").innerHTML=t.medicine;
document.getElementById("contactTitle").innerHTML=t.contact;
document.getElementById("noteTitle").innerHTML=t.note;

document.getElementById("saveBtn").innerHTML=t.save;

}


// ===== BMI 計算 =====

function calculateBMI(){

let h=document.getElementById("height").value/100;
let w=document.getElementById("weight").value;

if(h>0 && w>0){

let bmi=(w/(h*h)).toFixed(1);

document.getElementById("bmi").innerHTML=
"BMI："+bmi;

}else{

document.getElementById("bmi").innerHTML=
"BMI：--";

}

}


document.getElementById("height")
.addEventListener("input",calculateBMI);

document.getElementById("weight")
.addEventListener("input",calculateBMI);


// ===== 儲存資料 =====

function save(){

let data={

name:document.getElementById("name").value,

birthday:document.getElementById("birthday").value,

gender:document.getElementById("gender").value,

blood:document.getElementById("blood").value,

height:document.getElementById("height").value,

weight:document.getElementById("weight").value,

allergy:document.getElementById("allergy").value,

history:document.getElementById("history").value,

medicine:document.getElementById("medicine").value,

contact:document.getElementById("contact").value,

phone:document.getElementById("phone").value,

note:document.getElementById("note").value

};


localStorage.setItem(
"medicalRecord",
JSON.stringify(data)
);


alert("💗 Saved successfully!");

}



// ===== 開啟時讀取 =====

window.onload=function(){

let data=
JSON.parse(
localStorage.getItem("medicalRecord")
);


if(data){


document.getElementById("name").value=data.name || "";

document.getElementById("birthday").value=data.birthday || "";

document.getElementById("gender").value=data.gender || "";

document.getElementById("blood").value=data.blood || "";

document.getElementById("height").value=data.height || "";

document.getElementById("weight").value=data.weight || "";

document.getElementById("allergy").value=data.allergy || "";

document.getElementById("history").value=data.history || "";

document.getElementById("medicine").value=data.medicine || "";

document.getElementById("contact").value=data.contact || "";

document.getElementById("phone").value=data.phone || "";

document.getElementById("note").value=data.note || "";


calculateBMI();

}

}


</script>

</body>

</html>
